apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: monitoring
spec:
  project: monitoring
  source:
    repoURL: https://github.com/tu-repo/k8s-monitoring.git
    path: monitoring/loki
    chart: loki
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 5.8.0
    helm:
      valueFiles:
        - loki-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
