apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: monitoring
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 6.56.0
    helm:
      # Método 1: Usar valores directamente
      values: |
        # Usa un ConfigMap existente
        {{- $configMapName := "grafana-helm-values" }}
        {{- $configMapNamespace := "monitoring" }}
        {{- $configMap := lookup "v1" "ConfigMap" $configMapNamespace $configMapName }}
        {{- if $configMap }}
        {{- $configMap.data.values\.yaml | nindent 8 }}
        {{- end }}
      # O método 2: Usar plugin si lo has configurado
      # valueFiles: []
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

