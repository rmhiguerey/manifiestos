apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: monitoring
  source:
    repoURL: https://github.com/rmhiguerey/manifiestos.git
    path: stackmonitoring/grafana
    chart: grafana
    targetRevision: 6.56.0
    helm:
      valueFiles:
        - grafana-value.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

