apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  project: monitoring
  source:
    repoURL: https://github.com/rmhiguerey/manifiestos.git
    path: monitoring/grafana
    chart: grafana
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 6.56.0
    helm:
      valueFiles:
        - grafana-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
